name: Quiz leaderboard

# Quiz scores only appear on mygeeky.org for people who asked for it, from their own GitHub
# account (src/mygeeky/leaderboard.py says how, and docs/LEADERBOARD.md explains it in words).
#
# This job reads the 🏆 issues in the public ideas repo and writes website/data/leaderboard.json:
#   - an `accept` only counts when the account that wrote it is the one being shown;
#   - a later `withdraw` from that same account removes them, and the file is REWRITTEN, so no
#     old copy of someone's score stays in this branch's history;
#   - the maker's own account is left out (that is where the tests happen);
#   - a score below 80% is never written, agreed or not.
#
# It does not publish by itself: it opens (or updates) a pull request, so the maker approves
# every entry before it reaches the website. With DEEPSEEK_API_KEY set as a repository secret
# it also adds a "does this look like a real researcher" note to that pull request, which is
# the maker's own check, never a gate on anyone.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      rewrite:
        description: "Rewrite the board branch from scratch (use after a withdrawal)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read who asked for the board, and who took it back
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet requests platformdirs
          mkdir -p website/data
          python -m mygeeky.leaderboard harvest website/data/leaderboard.json | tee board.log

      - name: Check the file would be safe to publish
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "src")
          from mygeeky import leaderboard
          board = json.load(open("website/data/leaderboard.json", encoding="utf-8"))
          problems = leaderboard.problems(board)
          for p in problems:
              print(f"::error::{p}")
          print(f"{len(board.get('top') or [])} on this month's board, "
                f"{len(board.get('protocols') or {})} protocols with people")
          sys.exit(1 if problems else 0)
          PY

      - name: Add a "does this look like a real account" note for the maker
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY' | tee -a board.log
          import json, os, sys
          sys.path.insert(0, "src")
          from mygeeky import leaderboard
          from mygeeky.github_client import GitHubClient
          board = json.load(open("website/data/leaderboard.json", encoding="utf-8"))
          logins = sorted({w["login"] for w in (board.get("top") or []) + (board.get("hall") or [])})
          if not logins:
              print("\nNobody on the board yet.")
              raise SystemExit(0)
          client = GitHubClient(os.environ.get("GITHUB_TOKEN") or None)
          key = os.environ.get("DEEPSEEK_API_KEY") or None
          print("\n### Does the account look real? (the maker decides; this is only a note)\n")
          for login in logins:
              said = leaderboard.looks_real(client, login, key)
              mark = "✅" if said["looks_real"] else "⚠️"
              print(f"- {mark} **{login}** — {said['why']}")
          PY

      # This step does two things: it pushes the board to `leaderboard-update`, and then it asks
      # GitHub to open a pull request from it. The push always works. The second half is refused
      # outright when the account has "Allow GitHub Actions to create and approve pull requests"
      # switched off -- which is the default, and is a setting rather than anything this repository
      # can carry in a file:
      #
      #   GitHub Actions is not permitted to create or approve pull requests.
      #
      # That turned every nightly run red while the job had in fact done all of its work. So the
      # refusal is allowed to happen, and the step below turns it into a warning and a link instead.
      # Nothing is skipped and nothing is published without review either way: the branch is there,
      # and the maker still opens and approves the pull request by hand.
      - name: Open a pull request for the maker to approve
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: leaderboard-update
          base: main
          title: "🏆 Quiz leaderboard: entries to approve"
          commit-message: "Quiz leaderboard: entries people asked for"
          body-path: board.log
          labels: leaderboard
          delete-branch: true

      - name: Say where the board is, and how to let this open its own pull request
        env:
          OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ -n "$PR_URL" ]; then
            echo "Pull request ready for review: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COMPARE="https://github.com/$GITHUB_REPOSITORY/compare/main...leaderboard-update?expand=1"
          echo "::warning::The board branch is pushed, but Actions is not allowed to open the pull request. Open it at $COMPARE"
          {
            echo '### The board is ready. The pull request is not.'
            echo
            echo 'Everything this job does has been done: the issues were read, the board was written'
            echo 'and checked, and `leaderboard-update` has been pushed. Only the last step was refused,'
            echo 'because this account does not let GitHub Actions open pull requests.'
            echo
            echo "**Open it yourself:** <$COMPARE>"
            echo
            echo 'To have this job open it on its own in future: **Settings -> Actions -> General ->'
            echo 'Workflow permissions**, and tick *Allow GitHub Actions to create and approve pull'
            echo 'requests*. The same setting exists on the organisation, and the organisation wins, so'
            echo 'if the repository box is already ticked, check the organisation too.'
            echo
            echo 'Nothing reaches the website either way until the pull request is merged.'
          } >> "$GITHUB_STEP_SUMMARY"
