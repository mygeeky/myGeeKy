name: WISEP

# WISEP decides when myGeeKy may call the open databases (src/mygeeky/wisep.py; the phone: mobile/src/lib/wisep.ts).
# This checks it on all three desktop systems: its tests (the rules, the store, backing off, the evening top-up, and a
# month-long simulation that must make under half the calls of fixed timers without staler answers), the phone's
# rules agreeing with the computer's, and the benchmark -- how fast it decides, what its SQLite store costs on that
# system's disk, and one live OpenAlex ask answered from the store the second time. The numbers are kept as an
# artifact per system (wisep-bench-<os>.json). The evaluation plan: docs/WISEP.md.

on:
  push:
    branches: [main]
    paths: ["src/mygeeky/wisep.py", "mobile/src/lib/wisep.ts", "tests/test_wisep.py", "tools/wisep_bench.py",
            ".github/workflows/wisep.yml"]
  pull_request:
    paths: ["src/mygeeky/wisep.py", "mobile/src/lib/wisep.ts", "tests/test_wisep.py", "tools/wisep_bench.py"]
  schedule:
    - cron: "37 3 * * 0"          # weekly: OpenAlex's answers and the runners change under us
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8          # the benchmark prints µs and ·; Windows' console would choke on them
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -q -e . pytest
      - name: The phone's packages (for the phone-agrees test)
        working-directory: mobile
        run: npm ci --no-audit --no-fund --ignore-scripts
        continue-on-error: true
      - name: WISEP's tests
        run: python -m pytest -q -rs tests/test_wisep.py
      - name: The benchmark (with one live OpenAlex ask)
        run: python tools/wisep_bench.py --live --out wisep-bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wisep-bench-${{ matrix.os }}
          path: wisep-bench-${{ matrix.os }}.json
