<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeekOc, Moving</title>
<!--
  A page that just runs him. Open it in a browser -- locally, straight off the disk, or served.

  It exists because the design canvas renders its boards as stills, so everything built before it was
  only ever verified by measurement and never once watched. Numbers are good for catching a
  hundred-and-eighty degree snap or a teleport at the end of a loop, and they did catch both; they are
  no substitute for seeing whether the thing looks alive.

  There was a three-dimensional version of him for a day. It is gone: it did not look like the same
  creature, and it did not look much like an octopus either. The flat one is the character.
-->
<script src="geekoc.js"></script>
<script src="geekoc-canvas.js"></script>
<style>
  :root {
    --ink: #f2f2f7; --dim: rgba(242,242,247,.64); --line: rgba(255,255,255,.14);
    --bg: #0b1020; --panel: #17131f; --cyan: #7fd8ff; --pink: #ff6fd8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(70% 80% at 50% 0%, rgba(122,92,255,.22), transparent 70%),
      linear-gradient(180deg, #11121c 0%, var(--bg) 100%);
    background-color: var(--bg);
    display: flex; flex-direction: column; min-height: 100%;
  }
  header { padding: 18px 20px 6px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.3px; }
  header p { margin: 4px 0 0; font-size: 13.5px; color: var(--dim); max-width: 64ch; line-height: 1.5; }
  main { flex: 1 1 auto; min-height: 320px; padding: 10px 16px 0; }
  #flat {
    display: block; width: 100%; height: 100%; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
  }
  footer { padding: 12px 16px 22px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .group { min-width: 180px; }
  .label { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; color: rgba(242,242,247,.5); margin-bottom: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: 700 12.5px inherit; color: var(--dim); cursor: pointer; min-height: 40px;
    padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.05);
  }
  button:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
  button[aria-pressed="true"] { color: #fff; border-color: var(--cyan); background: rgba(127,216,255,.18); }
  label.slide { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  input[type=range] { width: 100%; accent-color: var(--pink); height: 38px; }
  #says { font-size: 12.5px; color: var(--dim); line-height: 1.5; max-width: 44ch; margin: 7px 0 0; }
  #trouble { margin: 0 16px 16px; padding: 12px 15px; border-radius: 12px; background: var(--panel);
             font-size: 13px; color: var(--dim); display: none; line-height: 1.55; }
  @media (max-width: 720px) { main { min-height: 44vh; } h1 { font-size: 19px; } }
</style>
</head>
<body>

<header>
  <h1>GeekOc, moving</h1>
  <p>
    Pick a way of moving, then a mood. Nothing tells the arms to follow &mdash; each is a chain of beads
    pulled towards where the pose says it belongs, so carrying him drags only their roots and the rest
    catches up late. That lag is the swimming.
  </p>
</header>

<main><canvas id="flat" aria-label="GeekOc, a friendly octopus in thick glasses, swimming" role="img"></canvas></main>

<p id="trouble"></p>

<footer>
  <div class="group" style="flex: 1 1 260px">
    <div class="label">HOW HE MOVES</div>
    <div class="row" id="moves"></div>
    <p id="says"></p>
  </div>

  <div class="group" style="flex: 1 1 240px">
    <div class="label">HIS FACE</div>
    <div class="row" id="faces"></div>
  </div>

  <div class="group" style="flex: 0 1 220px">
    <label class="slide" for="speed">Speed &mdash; <span id="speedOut">1.00&times;</span></label>
    <input id="speed" type="range" min="20" max="200" value="100">
    <label class="slide" for="trail">Arms trail &mdash; <span id="trailOut">some</span></label>
    <input id="trail" type="range" min="6" max="40" value="22">
  </div>
</footer>

<script>
(function () {
  'use strict';
  var G = window.GeekOc;
  var box = document.getElementById('flat');
  var trouble = document.getElementById('trouble');

  if (!G || !G.Life || !window.GeekOcCanvas) {
    trouble.textContent = 'geekoc.js and geekoc-canvas.js must sit beside this file; one of them did not load.';
    trouble.style.display = 'block';
    return;
  }
  var STAGE = [-245, 200, 1190, 455];
  var view = window.GeekOcCanvas.stage(box, STAGE);
  view.fit();
  window.addEventListener('resize', function () { view.fit(); });

  var SAYS = {
    cross: 'Across the stage and back, turning at each end rather than snapping about.',
    jet: 'Bursts and glides — the real gait. The arms snap shut on each burst and stream on each glide.',
    hover: 'Hanging about, barely going anywhere: the resting loop.',
    bob: 'Rising and sinking on the spot, the way he waits for you to read something.',
    circle: 'A slow circuit of the stage.',
  };

  var state = { move: 'cross', face: null, speed: 100, trail: 22 };
  var clock = 0, last = 0;
  var life = G.alive({});

  function frame(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now;
    clock += dt * (state.speed / 100);
    life.stiff = state.trail / 100;
    var m = life.follow(state.move, clock);     // the move carries him; the arms are only dragged
    life.step(m.pose, state.face, dt);
    /* Straight onto the canvas. This used to build an SVG string and hand it to innerHTML, which cost
     * the browser a re-parse of seven and a half thousand characters, about thirty fresh DOM nodes and
     * a re-resolved gradient and two clip paths -- sixty times a second. The JavaScript was never the
     * problem: measured, the physics and the rebuild together come to 0.31 ms against a 16.7 ms budget.
     * Everything after it was. */
    view.clear();
    window.GeekOcCanvas.draw(view.ctx, life.parts(m.pose, state.face));
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ the controls
  function chips(into, names, pick, chosen) {
    names.forEach(function (n) {
      var b = document.createElement('button');
      b.textContent = n;
      b.setAttribute('aria-pressed', String(n === chosen));
      b.addEventListener('click', function () {
        pick(n);
        Array.prototype.forEach.call(into.children, function (c) {
          c.setAttribute('aria-pressed', String(c.textContent === n));
        });
      });
      into.appendChild(b);
    });
  }

  var moveRow = document.getElementById('moves');
  chips(moveRow, Object.keys(G.MOVES), function (n) {
    state.move = n;
    clock = 0;
    document.getElementById('says').textContent = SAYS[n] || '';
  }, state.move);
  document.getElementById('says').textContent = SAYS[state.move] || '';

  // a face of 'none' hands the choice back to whichever pose is running
  var faceRow = document.getElementById('faces');
  chips(faceRow, ['as posed'].concat(Object.keys(G.FACES)), function (n) {
    state.face = n === 'as posed' ? null : n;
  }, 'as posed');

  document.getElementById('speed').addEventListener('input', function (e) {
    state.speed = Number(e.target.value);
    document.getElementById('speedOut').textContent = (state.speed / 100).toFixed(2) + '×';
  });
  document.getElementById('trail').addEventListener('input', function (e) {
    state.trail = Number(e.target.value);
    document.getElementById('trailOut').textContent =
      state.trail < 13 ? 'a lot' : state.trail > 30 ? 'barely' : 'some';
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
